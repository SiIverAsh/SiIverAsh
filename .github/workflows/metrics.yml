name: Profile Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: ["main", "master"]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest

    steps:
      - name: Languages metrics
        uses: SiIverAsh/metrics@master
        with:
          filename: metrics.languages.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""

          repositories: 10000
          repositories_batch: 50
          repositories_affiliations: ""
          repositories_forks: yes

          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_sections: most-used
          plugin_languages_details: lines, bytes-size, percentage
          plugin_languages_categories: programming, markup, data, prose
          plugin_languages_aliases: "Jupyter Notebook:Python"
          plugin_languages_colors: "Python:#3572A5"
          
          plugin_languages_limit: 8
          plugin_languages_other: yes

          plugin_languages_analysis_timeout: 60
          plugin_languages_analysis_timeout_repositories: 0


          commits_authoring: SiIverAsh, ${{ secrets.COMMIT_EMAIL }}
