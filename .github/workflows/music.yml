name: Music Profile Cards

on:
  schedule:
    # Refresh four times a day; the README always serves the last good copy.
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: music-profile-cards
  cancel-in-progress: true

jobs:
  update-music-cards:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Download music cards with retries
        env:
          NETEASE_USER_ID: "623550269"
        run: python scripts/update_music_cards.py

      - name: Commit cards when changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add music.week.svg music.all.svg

          if git diff --cached --quiet; then
            echo "No music card changes"
            exit 0
          fi

          git commit -m "chore: update music cards [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
